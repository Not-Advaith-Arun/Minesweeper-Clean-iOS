name: Minesweeper
options:
  bundleIdPrefix: com.xylo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    DEAD_CODE_STRIPPING: true
targets:
  MinesweeperCore:
    type: framework
    platform: iOS
    sources:
      - path: MinesweeperCore/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xylo.MinesweeperCleanReplica.Core
        DEFINES_MODULE: true
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: true

  Minesweeper:
    type: application
    platform: iOS
    sources:
      - path: MinesweeperApp
        excludes:
          - Resources
      - path: MinesweeperApp/Resources
        excludes:
          - Info.plist
        buildPhase: resources
    dependencies:
      - target: MinesweeperCore
    info:
      path: MinesweeperApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Minesweeper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.puzzle-games
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSupportsIndirectInputEvents: true
        UIAppFonts:
          - Rubik-Black.ttf
          - Rubik-BlackItalic.ttf
          - Rubik-Bold.ttf
          - Rubik-BoldItalic.ttf
          - Rubik-Italic.ttf
          - Rubik-Light.ttf
          - Rubik-LightItalic.ttf
          - Rubik-Medium.ttf
          - Rubik-MediumItalic.ttf
          - Rubik-Regular.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xylo.MinesweeperCleanReplica
        PRODUCT_NAME: Minesweeper
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.22.2
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""
    scheme:
      testTargets:
        - MinesweeperCoreTests
        - MinesweeperUITests

  MinesweeperCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MinesweeperCoreTests
    dependencies:
      - target: MinesweeperCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xylo.MinesweeperCleanReplica.CoreTests
        GENERATE_INFOPLIST_FILE: true

  MinesweeperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MinesweeperUITests
    dependencies:
      - target: Minesweeper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xylo.MinesweeperCleanReplica.UITests
        GENERATE_INFOPLIST_FILE: true

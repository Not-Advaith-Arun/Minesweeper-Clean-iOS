name: iOS CI and unsigned IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Minesweeper.xcodeproj
  SCHEME: Minesweeper
  XCODEGEN_VERSION: 2.45.4
  XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Report Apple toolchain
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun simctl list runtimes
          swift --version

      - name: Install pinned XcodeGen
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_root="$RUNNER_TEMP/xcodegen-tool"
          curl --fail --location --retry 3 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$archive"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum -a 256 --check
          mkdir -p "$install_root"
          ditto -x -k "$archive" "$install_root"
          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"
          "$install_root/xcodegen/bin/xcodegen" --version

      - name: Generate and inspect the Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -list
          test -f "$PROJECT/xcshareddata/xcschemes/$SCHEME.xcscheme"

      - name: Select and boot an iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          devices="$RUNNER_TEMP/simulator-devices.json"
          xcrun simctl list devices available --json > "$devices"
          udid="$(
            jq -r '
              [.devices | to_entries[] | .value[]
                | select(.isAvailable == true)
                | select(.name | startswith("iPhone"))]
              | sort_by(
                  if .name == "iPhone 17 Pro Max" then 0
                  elif .name == "iPhone 17 Pro" then 1
                  elif .name == "iPhone 16 Pro" then 2
                  else 3
                  end
                )
              | .[0].udid // empty
            ' "$devices"
          )"
          if [[ -z "$udid" ]]; then
            echo "No available iPhone simulator was found." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          name="$(jq -r --arg id "$udid" '.devices[][] | select(.udid == $id) | .name' "$devices" | head -n 1)"
          echo "Using $name ($udid)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b

      - name: Build app and run spanning UI journeys
        run: |
          set -euo pipefail
          mkdir -p build/ci
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/Minesweeper-Simulator-DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/MinesweeperTests.xcresult" \
            -enableCodeCoverage YES \
            test 2>&1 | tee build/ci/xcodebuild-test.log

      - name: Shut down simulator
        if: always() && steps.simulator.outputs.udid != ''
        run: xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" 2>/dev/null || true

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          device_derived="$RUNNER_TEMP/Minesweeper-Device-DerivedData"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$device_derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            "CODE_SIGN_IDENTITY=" \
            "DEVELOPMENT_TEAM=" \
            build 2>&1 | tee build/ci/xcodebuild-device.log

          app="$device_derived/Build/Products/Release-iphoneos/Minesweeper.app"
          test -d "$app"
          test -f "$app/Info.plist"
          package_root="$RUNNER_TEMP/Minesweeper-IPA"
          artifact_root="$GITHUB_WORKSPACE/build/artifacts"
          rm -rf "$package_root"
          mkdir -p "$package_root/Payload" "$artifact_root"
          ditto "$app" "$package_root/Payload/Minesweeper.app"
          find "$package_root/Payload" -type d -name _CodeSignature -prune -exec rm -rf {} +
          find "$package_root/Payload" -type f -name embedded.mobileprovision -delete
          test -z "$(find "$package_root/Payload" -type d -name _CodeSignature -print -quit)"
          test -z "$(find "$package_root/Payload" -type f -name embedded.mobileprovision -print -quit)"
          (
            cd "$package_root"
            /usr/bin/zip -qry "$artifact_root/Minesweeper-unsigned.ipa" Payload
          )
          (
            cd "$artifact_root"
            shasum -a 256 Minesweeper-unsigned.ipa > Minesweeper-unsigned.ipa.sha256
          )
          unzip -l "$artifact_root/Minesweeper-unsigned.ipa" | head -n 40

      - name: Upload unsigned Sideloadly IPA
        uses: actions/upload-artifact@v7
        with:
          name: Minesweeper-unsigned-ipa
          path: |
            build/artifacts/Minesweeper-unsigned.ipa
            build/artifacts/Minesweeper-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results and build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Minesweeper-test-results
          path: |
            ${{ runner.temp }}/MinesweeperTests.xcresult
            build/ci/*.log
          if-no-files-found: warn
          retention-days: 7
